<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- Fragment d'en-tête (Header) -->
<div th:fragment="header" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: #f8f9fa; border-bottom: 1px solid #dee2e6;">

    <!-- Titre / Marque de l'application -->
    <div style="font-weight: bold; font-size: 18px;">
        Supervision Équipements
    </div>

    <!-- Zone utilisateur connecté (Affichée uniquement si authentifié) -->
    <div sec:authorize="isAuthenticated()" style="font-size: 14px;">
        Bonjour
        <strong><span th:text="${utilisateurConnecte?.prenom}"></span></strong>
        ([<span th:text="${utilisateurConnecte?.profil}"></span>]) |

        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" style="background: none; border: none; color: #0d6efd; text-decoration: underline; cursor: pointer;">
                Déconnectez-vous
            </button>
        </form>
    </div>

</div>

</body>
</html>
